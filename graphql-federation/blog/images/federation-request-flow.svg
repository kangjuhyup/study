<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
  <title id="title">클라이언트에서 Gateway와 세 Subgraph를 거쳐 응답을 받는 흐름</title>
  <desc id="desc">클라이언트가 GraphQL 쿼리를 보내면 Gateway가 Profile, Inventory, Products Subgraph를 조회한다. 같은 Gateway가 결과를 병합하여 클라이언트에 응답한다.</desc>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#3062c3"/></marker>
    <marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#208579"/></marker>
    <style>
      text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;text-anchor:middle;fill:#172a42}
      .title{font-size:25px;font-weight:700}
      .detail{font-size:19px;fill:#52647b}
      .out{fill:none;stroke:#3062c3;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#blue)}
      .back{fill:none;stroke:#208579;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#teal)}
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="328" rx="24" fill="#fbfdff" stroke="#e1e8f2" stroke-width="2"/>
  <text x="560" y="40" class="title">클라이언트 요청 → Subgraph 조회 → 하나의 응답</text>
  <rect x="22" y="127" width="150" height="90" rx="15" fill="#eef2f8" stroke="#b9c8dc" stroke-width="2"/>
  <text x="97" y="181" class="title">클라이언트</text>
  <path d="M173 172H232" class="out"/>
  <text x="204" y="111" class="detail">쿼리</text>
  <rect x="237" y="127" width="160" height="90" rx="15" fill="#edf4ff" stroke="#719ade" stroke-width="2"/>
  <text x="317" y="163" class="title" style="fill:#2455a8">Gateway</text>
  <text x="317" y="195" class="detail">실행 계획</text>
  <path d="M398 172H431V97H474" class="out"/>
  <path d="M398 172H474" class="out"/>
  <path d="M398 172H431V247H474" class="out"/>
  <rect x="479" y="69" width="162" height="56" rx="13" fill="#edf9f5" stroke="#71b6a4" stroke-width="2"/>
  <text x="560" y="92" font-size="17" fill="#207263">서비스 A</text>
  <text x="560" y="115" font-size="23" font-weight="700">Profile</text>
  <rect x="479" y="144" width="162" height="56" rx="13" fill="#edf9f5" stroke="#71b6a4" stroke-width="2"/>
  <text x="560" y="167" font-size="17" fill="#207263">서비스 B</text>
  <text x="560" y="190" font-size="23" font-weight="700">Inventory</text>
  <rect x="479" y="219" width="162" height="56" rx="13" fill="#edf9f5" stroke="#71b6a4" stroke-width="2"/>
  <text x="560" y="242" font-size="17" fill="#207263">서비스 C</text>
  <text x="560" y="265" font-size="23" font-weight="700">Products</text>
  <path d="M642 97H689V172H724" class="back"/>
  <path d="M642 172H724" class="back"/>
  <path d="M642 247H689V172H724" class="back"/>
  <rect x="729" y="127" width="160" height="90" rx="15" fill="#edf4ff" stroke="#719ade" stroke-width="2"/>
  <text x="809" y="163" class="title" style="fill:#2455a8">Gateway</text>
  <text x="809" y="195" class="detail">결과 병합</text>
  <path d="M890 172H944" class="back"/>
  <text x="917" y="111" class="detail">응답</text>
  <rect x="949" y="127" width="150" height="90" rx="15" fill="#eef2f8" stroke="#b9c8dc" stroke-width="2"/>
  <text x="1024" y="181" class="title">클라이언트</text>
  <text x="560" y="308" class="detail">선택한 필드에 필요한 서비스만 호출 · 의존성에 따라 순차 또는 병렬 실행</text>
</svg>
